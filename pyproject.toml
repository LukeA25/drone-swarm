[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-swarm"
version = "0.1.0"
description = "Drone swarm formation control and quadrotor tracking experiments"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "matplotlib>=3.6",
    "pillow>=9",
]

[project.optional-dependencies]
physics = [
    "pybullet>=3.2.7",
    "gym-pybullet-drones @ git+https://github.com/learnsyslab/gym-pybullet-drones.git@bc5000cb52b0770c381b09db34fdc08c27858be8",
]

[project.scripts]
swarm-3d = "drone_swarm.demo3d:main"
swarm-physics-demo = "drone_swarm.physics_demo:main"
swarm-physics = "drone_swarm.physics_swarm:main"

[tool.setuptools.packages.find]
include = ["drone_swarm*"]
